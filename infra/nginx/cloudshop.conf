server {
 listen 80 default_server; listen [::]:80 default_server; server_name _;
 root /var/www/cloudshop; index index.html;
 location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
 location /api/ { proxy_pass http://BACKEND_ALB_DNS; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.html; }
}